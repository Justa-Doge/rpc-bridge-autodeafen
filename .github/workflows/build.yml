name: Build and Package

on:
  workflow_dispatch:
  push:
    branches: [ "master", "multi-ipc" ]
    tags: [ "v*" ]
    paths-ignore:
      - '.vscode/**'
      - 'docs/**'
      - mkdocs.yml
  pull_request:
    branches: [ "master", "multi-ipc" ]
    paths-ignore:
      - '.vscode/**'
      - 'docs/**'
      - mkdocs.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: sudo apt update && sudo apt -y install gcc-mingw-w64 make zip
    - name: Build bridge
      run: make
    - name: Build release package
      run: ./packaging/build-package.sh
    - name: Validate release package
      run: |
        unzip -tq dist/AutoDeafen-Bridge.zip
        cd dist
        sha256sum --check SHA256SUMS
    - name: Upload release package
      uses: actions/upload-artifact@v7
      with:
        name: AutoDeafen-Bridge
        path: dist
        if-no-files-found: error

  release:
    name: Publish Tagged Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
    - name: Download release package
      uses: actions/download-artifact@v8
      with:
        name: AutoDeafen-Bridge
        path: dist

    - name: Create GitHub release
      run: |
        gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AutoDeafen Bridge $GITHUB_REF_NAME" \
            --generate-notes
        gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS \
          --repo "$GITHUB_REPOSITORY" \
          --clobber

    env:
      GH_TOKEN: ${{ github.token }}
